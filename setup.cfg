# NOTE: linting and formatting is now configured in pyproject.toml (ruff).
# This file only keeps pytest config for compatibility with older runners.

[tool:pytest]
norecursedirs = .* *.egg-info dist build tmp scripts __pycache__ controllers models settings views i18n data locale po
python_files = test_*.py
python_functions = !test_suite
testpaths = src/gtimelog/addons
addopts = --ignore=setup.py --doctest-modules
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

[zest.releaser]
python-file-with-version = src/gtimelog/__init__.py
